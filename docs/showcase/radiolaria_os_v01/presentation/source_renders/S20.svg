<text id="S20_details" font-family="Nimbus Sans" font-size="30" font-weight="normal" fill="#16282B">
<tspan x="56" y="450.0">Source observations, payload schemas and effect mapping remain integration work.</tspan>
<tspan x="56" y="484.5">IAM, policy engines and cloud services are possible integrations, not endorsements.</tspan>
</text>
<text id="S20_qualification" font-family="Nimbus Sans" font-size="23" font-weight="normal" fill="#43595D">
<tspan x="56" y="619.0">Source admission and every current runtime action remain separate. The HOW link opens accepted source</tspan>
<tspan x="56" y="645.45">documentation.</tspan>
</text>

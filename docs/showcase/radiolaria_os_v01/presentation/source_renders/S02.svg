<rect width="1280" height="720" fill="white"/>
<text id="S02_title" font-family="Nimbus Sans" font-size="42" font-weight="bold" fill="#16282B">
<tspan x="54" y="78.0">A task has a life beyond one response</tspan>
</text>
<text id="S02_scope" font-family="Nimbus Sans" font-size="23" font-weight="normal" fill="#43595D">
<tspan x="56" y="136.0">CONCEPTUAL LIFETIME / Work and permission have different lifetimes</tspan>
</text>
<rect x="56.0" y="248" width="225" height="110" id="S02_lifetime_0" fill="#EFF5F3" stroke="#176B68" stroke-width="2"/>
<text id="S02_lifetime_0_label" font-family="Nimbus Sans" font-size="24" font-weight="normal" fill="#16282B">
<tspan x="69.0" y="284.0">Intent and</tspan>
<tspan x="69.0" y="311.6">current conditions</tspan>
</text>
<rect x="370.3333333333333" y="248" width="225" height="110" id="S02_lifetime_1" fill="#EFF5F3" stroke="#176B68" stroke-width="2"/>
<text id="S02_lifetime_1_label" font-family="Nimbus Sans" font-size="24" font-weight="normal" fill="#16282B">
<tspan x="383.3333333333333" y="284.0">Useful bounded</tspan>
<tspan x="383.3333333333333" y="311.6">Work</tspan>
</text>
<rect x="684.6666666666666" y="248" width="225" height="110" id="S02_lifetime_2" fill="#EFF5F3" stroke="#176B68" stroke-width="2"/>
<text id="S02_lifetime_2_label" font-family="Nimbus Sans" font-size="24" font-weight="normal" fill="#16282B">
<tspan x="697.6666666666666" y="284.0">Retained result</tspan>
<tspan x="697.6666666666666" y="311.6">when still</tspan>
<tspan x="697.6666666666666" y="339.2">applicable</tspan>
</text>
<rect x="999.0" y="248" width="225" height="110" id="S02_lifetime_3" fill="#EFF5F3" stroke="#176B68" stroke-width="2"/>
<text id="S02_lifetime_3_label" font-family="Nimbus Sans" font-size="24" font-weight="normal" fill="#16282B">
<tspan x="1012.0" y="284.0">Task ends</tspan>
<tspan x="1012.0" y="311.6">owned resources</tspan>
<tspan x="1012.0" y="339.2">close</tspan>
</text>
<line id="S02_lifetime_edge_0" x1="281.0" y1="303.0" x2="370.3333333333333" y2="303.0" stroke="#176B68" stroke-width="2" marker-end="url(#arrow)"/>
<text id="S02_lifetime_edge_0_label" font-family="Nimbus Sans" font-size="17" font-weight="normal" fill="#43595D">
<tspan x="285.0" y="238.0">organize</tspan>
</text>
<line id="S02_lifetime_edge_1" x1="595.3333333333333" y1="303.0" x2="684.6666666666666" y2="303.0" stroke="#176B68" stroke-width="2" marker-end="url(#arrow)"/>
<text id="S02_lifetime_edge_1_label" font-family="Nimbus Sans" font-size="17" font-weight="normal" fill="#43595D">
<tspan x="599.3333333333333" y="238.0">preserve /</tspan>
<tspan x="599.3333333333333" y="257.55">qualify</tspan>
</text>
<line id="S02_lifetime_edge_2" x1="909.6666666666666" y1="303.0" x2="999.0" y2="303.0" stroke="#176B68" stroke-width="2" marker-end="url(#arrow)"/>
<text id="S02_lifetime_edge_2_label" font-family="Nimbus Sans" font-size="17" font-weight="normal" fill="#43595D">
<tspan x="913.6666666666666" y="238.0">lifecycle</tspan>
<tspan x="913.6666666666666" y="257.55">order</tspan>
</text>
<rect x="416" y="428" width="410" height="80" id="S02_change" fill="#EFF5F3" stroke="#176B68" stroke-width="2"/>
<text id="S02_change_label" font-family="Nimbus Sans" font-size="24" font-weight="normal" fill="#16282B">
<tspan x="429" y="464.0">A condition changes</tspan>
</text>
<text id="S02_change_effect" font-family="Nimbus Sans" font-size="27" font-weight="normal" fill="#16282B">
<tspan x="56" y="552.0">Affected work obtains a new current basis.</tspan>
<tspan x="56" y="583.05">Unaffected history stays inspectable.</tspan>
</text>
<text id="S02_qualification" font-family="Nimbus Sans" font-size="23" font-weight="normal" fill="#43595D">
<tspan x="56" y="619.0">Continuity follows profile-specific time and scope checks. A preserved record alone does not establish truth or</tspan>
<tspan x="56" y="645.45">permission.</tspan>
</text>

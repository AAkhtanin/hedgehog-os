<text id="S24_scope" font-family="Nimbus Sans" font-size="23" font-weight="normal" fill="#43595D">
<tspan x="56" y="136.0">SENTINEL / 12 references; ten authored mappings; no field-performance transfer</tspan>
</text>
<text id="S24_label0" font-family="Nimbus Sans" font-size="26" font-weight="bold" fill="#16282B">
<tspan x="56" y="219.0">R04 / Rotolon</tspan>
</text>
<text id="S24_body0" font-family="Nimbus Sans" font-size="25" font-weight="normal" fill="#16282B">
<tspan x="385" y="218.0">Monitoring interruption -&gt; distinguish reserve from insufficient evidence -&gt;</tspan>
<tspan x="385" y="246.75">C03/S3 -&gt; D02,D05.</tspan>
</text>
<text id="S24_label1" font-family="Nimbus Sans" font-size="26" font-weight="bold" fill="#16282B">
<tspan x="56" y="341.0">R07 / rainfall telemetry</tspan>
</text>
<text id="S24_body1" font-family="Nimbus Sans" font-size="25" font-weight="normal" fill="#16282B">
<tspan x="385" y="340.0">Observation interval is not delivery time -&gt; C02 currentness checks -&gt;</tspan>
<tspan x="385" y="368.75">D02,D03,D06.</tspan>
</text>
<text id="S24_label2" font-family="Nimbus Sans" font-size="26" font-weight="bold" fill="#16282B">
<tspan x="56" y="463.0">R10 / multiple surges</tspan>
</text>
<text id="S24_body2" font-family="Nimbus Sans" font-size="25" font-weight="normal" fill="#16282B">
<tspan x="385" y="462.0">Silence is not recovery -&gt; fresh measured sequence and separate OFF -&gt;</tspan>
<tspan x="385" y="490.75">C07/S5 -&gt; D02,D03.</tspan>
</text>
<text id="S24_qualification" font-family="Nimbus Sans" font-size="23" font-weight="normal" fill="#43595D">
<tspan x="56" y="619.0">Accepted source map inspected. Omitted raw return members remain raw-not-inspected. No researcher</tspan>
<tspan x="56" y="645.45">endorsement.</tspan>
</text>

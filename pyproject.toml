[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgehog-os-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema",
  "pytest"
]

[tool.setuptools.packages.find]
include = ["hedgehog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

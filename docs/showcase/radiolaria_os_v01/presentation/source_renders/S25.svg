<title id="title">Useful data, permitted action and location differ</title>
<desc id="desc">EXTERNAL CONTEXT / Primary-source descriptions, not comparative experiments</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#176B68"/></marker></defs>
<rect width="1280" height="720" fill="white"/>
<text id="S25_title" font-family="Nimbus Sans" font-size="42" font-weight="bold" fill="#16282B">
<tspan x="54" y="78.0">Useful data, permitted action and location differ</tspan>
</text>
<text id="S25_scope" font-family="Nimbus Sans" font-size="23" font-weight="normal" fill="#43595D">
<tspan x="56" y="136.0">EXTERNAL CONTEXT / Primary-source descriptions, not comparative experiments</tspan>
</text>
<text id="S25_label0" font-family="Nimbus Sans" font-size="26" font-weight="bold" fill="#16282B">
<tspan x="56" y="219.0">Microsoft IFC / FIDES</tspan>
</text>
<text id="S25_body0" font-family="Nimbus Sans" font-size="25" font-weight="normal" fill="#16282B">
<tspan x="385" y="218.0">Integrity and confidentiality labels propagate; policy checks precede tools.</tspan>
<tspan x="385" y="246.75">Experimental defaults and approval limits remain.</tspan>
</text>
<text id="S25_label1" font-family="Nimbus Sans" font-size="26" font-weight="bold" fill="#16282B">
<tspan x="56" y="341.0">Apple local</tspan>
<tspan x="56" y="370.9">computation</tspan>
</text>
<text id="S25_body1" font-family="Nimbus Sans" font-size="25" font-weight="normal" fill="#16282B">
<tspan x="385" y="340.0">The dated manufacturer announcement illustrates possible local</tspan>
<tspan x="385" y="368.75">participants. No Radiolaria performance or adapter result.</tspan>
</text>
<text id="S25_label2" font-family="Nimbus Sans" font-size="26" font-weight="bold" fill="#16282B">
<tspan x="56" y="463.0">Independent owners</tspan>
</text>
<text id="S25_body2" font-family="Nimbus Sans" font-size="25" font-weight="normal" fill="#16282B">
<tspan x="385" y="462.0">A local model, an organization and a remote service may contribute data.</tspan>
<tspan x="385" y="490.75">None inherits another owner&#x27;s final authority.</tspan>
</text>
<text id="S25_qualification" font-family="Nimbus Sans" font-size="23" font-weight="normal" fill="#43595D">
<tspan x="56" y="619.0">Current packets and actual consumption remain distinct. No endorsement, superiority result or new integration</tspan>
<tspan x="56" y="645.45">claimed.</tspan>
</text>
<line id="S25_rule" x1="56" y1="671" x2="1218" y2="671" stroke="#B8C8C6" stroke-width="1"/>
